<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Stopwatch">
  <!-- Matches the in-app header mark: indigo-500 -> violet-600 on a rounded square. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#g)"/>

  <!-- Crown + side button read as "stopwatch" rather than "clock" even at 16px. -->
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 12h14"/>
    <path d="M32 12v6"/>
    <path d="M48.5 21.5 45 25"/>
    <circle cx="32" cy="38" r="17"/>
    <!-- Single bold hand to 12; thinner strokes disappear when scaled down. -->
    <path d="M32 38V28"/>
  </g>
</svg>
